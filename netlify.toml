# Generated by ops/stack_loop.py — the deploy half of the nine-stack loop.
# Netlify serves at the ROOT of its own subdomain, which is what the repo route map assumes:
# a site under /<repo>/ would break URL→file resolution, the very thing this loop measures.
[build]
  command = "pip install -r requirements.txt && python freeze.py"
publish = "build"

[build.environment]
  PYTHON_VERSION = "3.12"
